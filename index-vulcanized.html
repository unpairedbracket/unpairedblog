<script>
  /**
   * `IronResizableBehavior` is a behavior that can be used in Polymer elements to
   * coordinate the flow of resize events between "resizers" (elements that control the
   * size or hidden state of their children) and "resizables" (elements that need to be
   * notified when they are resized or un-hidden by their parents in order to take
   * action on their new measurements).
   * Elements that perform measurement should add the `IronResizableBehavior` behavior to
   * their element definition and listen for the `iron-resize` event on themselves.
   * This event will be fired when they become showing after having been hidden,
   * when they are resized explicitly by another resizable, or when the window has been
   * resized.
   * Note, the `iron-resize` event is non-bubbling.
   *
   * @polymerBehavior Polymer.IronResizableBehavior
   * @demo demo/index.html
   **/
  Polymer.IronResizableBehavior = {
    properties: {
      /**
       * The closest ancestor element that implements `IronResizableBehavior`.
       */
      _parentResizable: {
        type: Object,
        observer: '_parentResizableChanged'
      },

      /**
       * True if this element is currently notifying its descedant elements of
       * resize.
       */
      _notifyingDescendant: {
        type: Boolean,
        value: false
      }
    },

    listeners: {
      'iron-request-resize-notifications': '_onIronRequestResizeNotifications'
    },

    created: function() {
      // We don't really need property effects on these, and also we want them
      // to be created before the `_parentResizable` observer fires:
      this._interestedResizables = [];
      this._boundNotifyResize = this.notifyResize.bind(this);
    },

    attached: function() {
      this.fire('iron-request-resize-notifications', null, {
        node: this,
        bubbles: true,
        cancelable: true
      });

      if (!this._parentResizable) {
        window.addEventListener('resize', this._boundNotifyResize);
        this.notifyResize();
      }
    },

    detached: function() {
      if (this._parentResizable) {
        this._parentResizable.stopResizeNotificationsFor(this);
      } else {
        window.removeEventListener('resize', this._boundNotifyResize);
      }

      this._parentResizable = null;
    },

    /**
     * Can be called to manually notify a resizable and its descendant
     * resizables of a resize change.
     */
    notifyResize: function() {
      if (!this.isAttached) {

      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background-color: var(--paper-grey-200, #eee);

        background-color: var(--paper-blue-grey-500, #607d8b);

        background-color: var(--paper-blue-grey-500, #607d8b);

    paper-toolbar.tall {
      background-color: transparent;
    }

    paper-toolbar.tall .title {
      font-size: 40px;
      margin-left: 60px;

      -webkit-transform-origin: left center;
      transform-origin: left center;

      margin: 0 8px;
    }

      padding: 8px;
    }
    
    paper-toolbar .title {
      line-height: 60px !important;

  <script>

    Polymer({

      is: 'iron-icon',

      properties: {

        /**
         * The name of the icon to use. The name should be of the form:
         * `iconset_name:icon_name`.
         */
        icon: {
          type: String,
          observer: '_iconChanged'
        },

        /**
         * The name of the theme to used, if one is specified by the
         * iconset.
         */
        theme: {
          type: String,
          observer: '_updateIcon'
        },

        /**
         * If using iron-icon without an iconset, you can set the src to be
         * the URL of an individual icon image file. Note that this will take
         * precedence over a given icon attribute.
         */
        src: {
          type: String,
          observer: '_srcChanged'
        }
      },

      _DEFAULT_ICONSET: 'icons',

      _iconChanged: function(icon) {
        var parts = (icon || '').split(':');
        this._iconName = parts.pop();
        this._iconsetName = parts.pop() || this._DEFAULT_ICONSET;
        this._updateIcon();
      },

      _srcChanged: function(src) {
        this._updateIcon();
      },

      _usesIconset: function() {
        return this.icon || !this.src;
      },

      _updateIcon: function() {
        if (this._usesIconset()) {
          if (this._iconsetName) {
            this._iconset = this.$.meta.byKey(this._iconsetName);
            if (this._iconset) {
              this._iconset.applyIcon(this, this._iconName, this.theme);
            } else {
              this._warn(this._logf('_updateIcon', 'could not find iconset `'
                + this._iconsetName + '`, did you import the iconset?'));
            }
          }
        } else {
          if (!this._img) {
            this._img = document.createElement('img');
            this._img.style.width = '100%';
            this._img.style.height = '100%';
          }
          this._img.src = this.src;
          Polymer.dom(this.root).appendChild(this._img);
        }
      }

    });

  </script>

        box-shadow: 0 2px 10px 0 rgba(0, 0, 0, 0.16);
      }

      .chip-top {
        width: 200px;
        height: 200px;
      }

      .chip-bottom {
        padding: 8px;
        line-height: 1.5;
      }

      .chip-project-name {
        font-weight: bold;
      }
      
      .chip-project-image {
        box-sizing: border-box;
        height: auto;
        width: 100%;
        padding: 20%;
      }
      
      #list-container {
        height: 100%;
        align-items: center;
        align-content: center;
      }
    </style>

    <section id="list-container" class="layout horizontal center-justified wrap">

      <template is="dom-repeat" items="{{items}}">

        <div class="chip" on-tap="_onTap">
          <div class="chip-top chip-lvl-2" style$="{{item.color}}">
            <img class="chip-project-image chip-lvl-3" src$="{{item.image}}">
          </div>
          <div class="chip-bottom chip-lvl-2">
            <div class="chip-project-name chip-lvl-3">{{item.name}}</div>
            <div class="chip-short-desc chip-lvl-3">{{item.shortDesc}}</div>
          </div>
        </div>

      </template>

    </section>
  </template>
</dom-module>

<script>
(function() {

  Polymer({
    is: 'project-list',

    ready: function() {
      this.items = [];
    },
    
    behaviors: [
      Polymer.NeonSharedElementAnimatableBehavior
    ],

    properties: {
      selectedProject: {
        type: Object,
        reflectToAttribute: true,
        notify: true,
      },
      
      sharedElements: {
        value: function() {
          return {
            'project-body': null,
            'project-art': null,
            'project-name': null,
            'project-description': null
          }
        }
      },
      animationConfig: {
        value: function() {
          return {
            'entry': [{
              name: 'hero-animation',
              id: 'project-body',
              toPage: this
            },{
              name: 'hero-animation',
              id: 'project-art',
              toPage: this
            },{
              name: 'cascaded-animation',
              animation: 'scale-up-animation',
            }],
            'exit': [{
              name: 'hero-animation',
              id: 'project-body',
              fromPage: this
            },{
              name: 'hero-animation',
              id: 'project-art',
              fromPage: this
            },{
              name: 'cascaded-animation',
              animation: 'scale-down-animation',
            }]
          }
        }
      }
    },

    _onTap: function(event) {
      var target = event.target;
      
      if (target.classList.contains('chip-lvl-3')) {
        target = target.parentNode;
      }
      
      if (target.classList.contains('chip-lvl-2')) {
        target = target.parentNode;
      }
      
      if (target.classList.contains('chip')) {
        // configure the page animation
        this.sharedElements = {
          'project-body': target,
          'project-art': target.querySelector('.chip-top')
        };

        this.selectedProject = event.model.item;
        
        var nodesToScale = [];
        var chips = Polymer.dom(this.root).querySelectorAll('.chip');
        for (var node, index = 0; node = chips[index]; index++) {
          if (node !== target) {
            nodesToScale.push(node);
          }
        }
        this.animationConfig['entry'][2].nodes = nodesToScale;
        this.animationConfig['exit'][2].nodes = nodesToScale;

        this.fire('project-click');
      }      
    },
    
    addProject: function(projectID, projectName, projectDescriptionShort, projectDescription, projectColor) {
      this.push('items', { id: projectID, name: projectName, shortDesc: projectDescriptionShort, longDesc: projectDescription, color: 'background:#'+projectColor+';', image: "img/projects-new/"+projectID+".svg" });
    }
  });
})();
</script>
