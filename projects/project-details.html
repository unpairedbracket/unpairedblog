<link rel="import" href="../bower_components/neon-animation/animations/hero-animation.html">
<link rel="import" href="../bower_components/neon-animation/neon-shared-element-animatable-behavior.html">
<link rel="import" href="../bower_components/iron-flex-layout/iron-flex-layout.html">
<script src="../bower_components/jquery/dist/jquery.min.js"></script>

<dom-module id="project-details">
  <style>
    
    #details {
      padding: 10%;
      height: 100%;
    }
    
    #detailsText {
      height: 100%;
    }
    
    .card {
      @apply(--layout-horizontal);
      height: 400px;
      border-radius: 3px;
      text-align: start;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 6px 20px 0 rgba(0, 0, 0, 0.19);
    }
    
    .card-left {
      width: 400px;
      height:400px;
    }

    .card-right {
      padding: 24px;
      overflow-y: hidden;
    }

    .card-project-name {
      font-size: 2em;
    }
    
    .card-project-description {
      overflow-y: auto;
    }
    
    .card-project-image {
      flex: none;
      box-sizing: border-box
      display: block;
      height: auto;
      width: 100%;
      padding: 20%;
    }
    
    @media(max-width: 768px) {
      .card {
        @apply(--layout-vertical);
        @apply(--layout-center);
        height: 500px;
      }
      
      .card-left {
        border-radius: 50%;
        width: 50%;
        max-width: 100px;
        height: auto;
        margin: 50px;      
      }
      
      .card-right {
        padding: 0px 24px 24px;
      }
      
      #detailsText {
        height: 276px;
      }
      
      #detailsDescription {
        height: 233.15px;
      }
    }
  </style>

  <template>  
    <section id="details" class="layout vertical center-justified">
      <div id="detailsCard" class="card">
        <div id="detailsArt" class="card-left" style$="{{selectedProject.color}}">
          <img class="card-project-image" src$="{{selectedProject.image}}"></img>
        </div>
        <div id="detailsRight" class="card-right flex">
          <div id="detailsText" class="flex layout vertical">
            <div id="detailsTitle" class="card-project-name">{{selectedProject.name}}</div>
            <div id="detailsDescription" class="card-project-description flex"></div>
          </div>
        </div>
      </div>

    </section>
  </template>
</dom-module>

<script>
(function() {
  Polymer({
      is: 'project-details',
      
    behaviors: [
      Polymer.NeonSharedElementAnimatableBehavior
    ],

    listeners: {
      'selected-project-changed': 'repopulateDescription'
    },
    
    repopulateDescription: function(event) {
      var $desc = $( "#detailsDescription" );
      var newProject = event.detail.value;
      var htmlString = newProject.longDesc;
      var html = $.parseHTML( htmlString );
      var nodeNames = [];
      
      while ($desc[0].firstChild) {
          $desc[0].removeChild($desc[0].firstChild);
      }
       
      // Append the parsed HTML
      $desc.append( html );
    },

    
    properties: {
      selectedProject: {
        type: Object,
        reflectToAttribute: true,
        notify: true,
      },
      
      sharedElements: {
        value: function() {
          return {
            'project-body': this.$.detailsCard,
            'project-art': this.$.detailsArt,
          }
        }
      },

      animationConfig: {
        value: function() {
          return {
            'entry': [{
              name: 'hero-animation',
              id: 'project-body',
              toPage: this
            },{
              name: 'hero-animation',
              id: 'project-art',
              toPage: this
            }],
            'exit': [{
              name: 'hero-animation',
              id: 'project-body',
              fromPage: this
            },{
              name: 'hero-animation',
              id: 'project-art',
              fromPage: this
            }]
          }
        }
      },
    } 
  });
})();
</script>
