<link href="bower_components/neon-animation/neon-animated-pages.html" rel="import">
<link href="bower_components/neon-animation/neon-shared-element-animatable-behavior.html" rel="import">
<link href="bower_components/neon-animation/animations/hero-animation.html" rel="import">
<link href="bower_components/neon-animation/animations/cascaded-animation.html" rel="import">

<dom-module id="project-list">
  <template>
    <section>

      <div class="chip-container">

        <template is="dom-repeat" items="{{items}}">

          <div class="chip">
            <div class="chip-top" style$="{{item.color}}"></div>
            <div class="chip-bottom">
              <div class="chip-album-title">{{item.album}}</div>
              <div class="chip-artist">{{item.artist}}</div>
            </div>
          </div>

        </template>

      </div>
    </section>
  </template>
</dom-module>

<script>
(function() {

  Polymer({
      is: 'project-list',

      ready: function() {
        this.items = [
          { artist: 'Tycho', album: 'Fragments', color: 'background:#f4db33;' },
          { artist: 'Tycho', album: 'Past Prologue', color: 'background:#972ff8;' },
          { artist: 'Tycho', album: 'Spectre', color: 'background:#7dd6fe;' },
          { artist: 'Tycho', album: 'Awake', color: 'background:#dc3c84;' }
        ];
      },
      
      behaviors: [
        Polymer.NeonSharedElementAnimatableBehavior
      ],

      properties: {

        animationConfig: {
          value: function() {
            var circles = Polymer.dom(this.root).querySelectorAll('.circle');
            var circlesArray = Array.prototype.slice.call(circles);
            return {
              'entry': [{
                name: 'cascaded-animation',
                animation: 'scale-up-animation',
                nodes: circlesArray
              }],

              'exit': [{
                name: 'hero-animation',
                id: 'hero',
                fromPage: this
              }, {
                name: 'cascaded-animation',
                animation: 'scale-down-animation'
              }]
            };
          }
        }
      },

      listeners: {
        'click': '_onClick'
      },

      _onClick: function(event) {
        target = event.target;
        if (target.classList.contains('chip-album') || target.classList.contains('chip-artist')) {
          // configure the page animation
          target = target.parentElement;
        }
       
        if (target.classList.contains('chip-top') || target.classList.contains('chip-bottom')) {
          // configure the page animation
          target = target.parentElement;
        }
       
        if (target.classList.contains('chip')) {
          // configure the page animation
          this.sharedElements = {
            'hero': target
          };

          this.fire('project-click');
        }
      }

  });
})();
</script>
