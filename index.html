<html>
<head>
  <title>Ben Spiers</title>

  <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, user-scalable=yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <script src="bower_components/webcomponentsjs/webcomponents-lite.js"></script>

  <link rel="import" href="bower_components/paper-material/paper-material.html">
  <link rel="import" href="bower_components/paper-scroll-header-panel/paper-scroll-header-panel.html">
  <link rel="import" href="bower_components/paper-toolbar/paper-toolbar.html">

  <link rel="import" href="projects/project-section.html">

  <link rel="stylesheet" href="main.css">
  
  <script>
    (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
    (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
    m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
    })(window,document,'script','//www.google-analytics.com/analytics.js','ga');

    ga('create', 'UA-64640706-1', 'auto');
    ga('send', 'pageview');
  </script>

  <style is="custom-style">

    paper-scroll-header-panel {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background-color: var(--paper-grey-200, #eee);

      /* background for toolbar when it is at its full size */
      --paper-scroll-header-panel-full-header: {
        background-color: var(--paper-blue-grey-500, #607d8b);
      };

      /* background for toolbar when it is condensed */
      --paper-scroll-header-panel-condensed-header: {
        background-color: var(--paper-blue-grey-500, #607d8b);
      };
    }
    
    paper-scroll-header-panel::shadow #mainContainer {
      -webkit-transform: none;
      transform: none;
    }

    .title-container {
      height: 100%;
    }

    .bottom.left {
      @apply(--paper-font-title);
      margin-left: 183px;
    }
    
    paper-toolbar img {
      box-sizing: border-box;
      height: 300%;
      padding: 30% 3.2px;
      width: auto;
    }

    paper-toolbar.tall {
      background-color: transparent;
    }

    paper-toolbar.tall .title {
      @apply(--paper-font-display1);

      font-size: 40px;
      margin-left: 20px;

      -webkit-transform-origin: left center;
      transform-origin: left center;

      /* Issue #15 */
      isolation: isolate;
    }

    paper-toolbar.tall iron-icon {
      margin: 0 8px;
    }

    .content {
      padding: 8px;
    }
    
    .main-section {
      box-sizing: border-box;
      height: 480px;
      padding: 36px;
      width: 80%;
    }
    
    paper-material {
      border-radius: 3px;
      text-align: start;
      overflow: hidden;
      background: #fff;
    }
    
    @media(max-width: 1680px) {
      .main-section {
        max-width: 900px;
        height: 604px;
      }
    }

    @media(max-width: 885px) {
      .main-section {
        height: 870px;
      }
    }

    @media(max-width: 625px) {
      .main-section {
        height: 1668px;
      }
    }
    
    @media(max-width: 365px) {
      .main-section {
        width: 100%;
        padding: 0;
      }
    }

  </style>

</head>
<body unresolved>

  <paper-scroll-header-panel condenses>

    <paper-toolbar class="tall">
      <div class="middle title-container center horizontal layout">
        <img src="img/profile.png" alt="">
        <div class="title">Ben Spiers</div>
      </div>
      <div class="bottom left">Physicist - Modder - Programmer</div> 

    </paper-toolbar>

    <div class="content vertical center layout">      
      <paper-material class="main-section" elevation="2">
        <project-section></project-section>
      </paper-material>
    </div>

  </paper-scroll-header-panel>

  <script>

    // custom transformation: scale header's title
    
    var title = document.querySelector('.title');
    var image = document.querySelector('paper-toolbar img');
    var titleContainer = document.querySelector('.title-container');
    addEventListener('paper-header-transform', function(e) {
      var d = e.detail;
      var m = d.height - d.condensedHeight;
      var y = Math.min(1, d.y / m);
      var scale = Math.max(0.75, 1 - 0.25*(d.y /m));
      var imgscale = Math.max(0, 1 - (d.y / m));

      // move/translate titleContainer
      Polymer.Base.transform('translate3d(0,' + y * 94 + '%,0)', titleContainer);
      // scale title
      Polymer.Base.transform('scale(' + scale + ') translateZ(0) translate3d(-' + y * 240 + 'px,0,0)', title);
      Polymer.Base.transform('scale(' + imgscale + ') translateZ(0)', image);
    });
    
  </script>
</body>
</html>
