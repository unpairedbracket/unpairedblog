<link rel="import" href="../bower_components/neon-animation/animations/cascaded-animation.html">
<link rel="import" href="../bower_components/neon-animation/animations/hero-animation.html">
<link rel="import" href="../bower_components/neon-animation/animations/scale-down-animation.html">
<link rel="import" href="../bower_components/neon-animation/animations/scale-up-animation.html">
<link rel="import" href="../bower_components/neon-animation/neon-shared-element-animatable-behavior.html">
<link rel="import" href="../bower_components/paper-material/paper-material.html">

<dom-module id="project-list">
  <style>    
    * {
      box-sizing: border-box;
    }

    .chip {
      border-radius: 3px;
      margin: 4px;
      overflow: hidden;
      text-align: start;
      background-color: #fff;
    }

    .chip-top {
      width: 200px;
      height: 200px;
    }

    .chip-bottom {
      padding: 8px;
      line-height: 1.5;
    }

    .chip-project-name {
      font-weight: bold;
    }

    .chip-project-image {
      height: auto;
      width: 100%;
      padding: 20%;
    }

    #list-container {
      height: 100%;
      align-items: center;
      align-content: center;
      padding: -100px;
    }
  </style>


  <template>
    <section id="list-container" class="layout horizontal center-justified wrap">

      <template is="dom-repeat" items="{{items}}">

        <paper-material class="chip" elevation="1" on-tap="_onTap">
          <div class="chip-top chip-lvl-2" style$="{{item.color}}">
            <img class="chip-project-image chip-lvl-3" src$="{{item.image}}"></img>
          </div>
          <div class="chip-bottom chip-lvl-2">
            <div class="chip-project-name chip-lvl-3">{{item.name}}</div>
            <div class="chip-short-desc chip-lvl-3">{{item.shortDesc}}</div>
          </div>
        </paper-material>

      </template>

    </section>
  </template>
</dom-module>

<script>
(function() {

  Polymer({
    is: 'project-list',

    ready: function() {
      this.items = [];
    },
    
    behaviors: [
      Polymer.NeonSharedElementAnimatableBehavior
    ],

    properties: {
      selectedProject: {
        type: Object,
        reflectToAttribute: true,
        notify: true,
      },
      
      sharedElements: {
        value: function() {
          return {
            'project-body': null,
            'project-art': null,
            'project-name': null,
            'project-description': null
          }
        }
      },
      animationConfig: {
        value: function() {
          return {
            'entry': [{
              name: 'hero-animation',
              id: 'project-body',
              toPage: this
            },{
              name: 'hero-animation',
              id: 'project-art',
              toPage: this
            },{
              name: 'cascaded-animation',
              animation: 'scale-up-animation',
            }],
            'exit': [{
              name: 'hero-animation',
              id: 'project-body',
              fromPage: this
            },{
              name: 'hero-animation',
              id: 'project-art',
              fromPage: this
            },{
              name: 'cascaded-animation',
              animation: 'scale-down-animation',
            }]
          }
        }
      }
    },

    _onTap: function(event) {
      var target = event.target;
      
      if (target.classList.contains('chip-lvl-3')) {
        target = target.parentNode;
      }
      
      if (target.classList.contains('chip-lvl-2')) {
        target = target.parentNode;
      }
      
      if (target.classList.contains('chip')) {
        // configure the page animation
        this.sharedElements = {
          'project-body': target,
          'project-art': target.querySelector('.chip-top')
        };

        this.selectedProject = event.model.item;
        
        var nodesToScale = [];
        var chips = Polymer.dom(this.root).querySelectorAll('.chip');
        for (var node, index = 0; node = chips[index]; index++) {
          if (node !== target) {
            nodesToScale.push(node);
          }
        }
        this.animationConfig['entry'][2].nodes = nodesToScale;
        this.animationConfig['exit'][2].nodes = nodesToScale;

        this.fire('project-click');
      }      
    },
    
    addProject: function(projectID, projectName, projectDescriptionShort, projectDescription, projectColor) {
      this.push('items', { id: projectID, name: projectName, shortDesc: projectDescriptionShort, longDesc: projectDescription, color: 'background:#'+projectColor+';', image: "img/projects/"+projectID+".svg" });
    }
  });
})();
</script>
